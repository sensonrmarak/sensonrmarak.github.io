<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How an aircraft flies</title>
<style>
@font-face { font-family:"Disp"; src:url("assets/fonts/cinzel-800.woff2") format("woff2"); font-weight:400; }
@font-face { font-family:"Disp"; src:url("assets/fonts/cinzel-900.woff2") format("woff2"); font-weight:700 900; }
@font-face { font-family:"Body"; src:url("assets/fonts/montserrat-500.woff2") format("woff2"); font-weight:400 500; }
@font-face { font-family:"Body"; src:url("assets/fonts/montserrat-600.woff2") format("woff2"); font-weight:600; }
@font-face { font-family:"Body"; src:url("assets/fonts/montserrat-700.woff2") format("woff2"); font-weight:700; }
@font-face { font-family:"Body"; src:url("assets/fonts/montserrat-800.woff2") format("woff2"); font-weight:800 900; }
:root { --navy:#0f2557; --gold:#e8b548; --cream:#fbf5e9; --ink:#0b1020; --accent:#ff5a1f; --disp:"Disp",Georgia,serif; --mono:"Body",Arial,sans-serif; --body:"Body",Arial,sans-serif; }
html,body { margin:0; background:#000; overflow:hidden; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#000; font-family:var(--body); color:var(--cream); }
#gl { position:absolute; inset:0; width:1920px; height:1080px; }
#veil { position:absolute; inset:0; background:#000; opacity:0; }
#flash { position:absolute; inset:0; background:var(--gold); transform:translateX(-101%); z-index:40; }
.ov { position:absolute; inset:0; display:none; }
#labels, #lines { position:absolute; inset:0; pointer-events:none; }
.lab { position:absolute; left:0; top:0; white-space:nowrap; font:700 23px var(--mono); letter-spacing:1px; text-transform:uppercase; color:var(--cream); background:rgba(14,16,22,.92); border:2px solid var(--gold); border-radius:10px; padding:9px 16px; }
.lab small { display:block; font:500 19px var(--mono); color:#cfd6e6; letter-spacing:0; margin-top:3px; text-transform:none; }
.lab.big { font:700 36px var(--disp); letter-spacing:1px; padding:10px 20px; }
.lab.red { border-color:#ff4a3a; color:#ffd9d4; }
#chip { position:absolute; left:0; top:0; display:flex; align-items:center; gap:16px; transform-origin:0 0; white-space:nowrap; }
#chip b { font:700 30px var(--disp); background:var(--gold); color:var(--ink); border-radius:10px; padding:8px 14px; }
#chip span { font:700 34px var(--disp); letter-spacing:1.5px; text-shadow:0 2px 12px rgba(0,0,20,.55); }
#src { position:absolute; right:48px; top:46px; font:500 18px var(--body); color:#c9cfdb; background:rgba(255,255,255,.07); border-radius:8px; padding:7px 14px; }
#prog { position:absolute; left:0; top:0; height:6px; background:var(--gold); width:0; z-index:30; }
#dots { position:absolute; left:50%; top:22px; transform:translateX(-50%); display:flex; gap:9px; }
#dots i { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.28); }
#dots i.on { background:var(--gold); }
#logo { position:absolute; right:34px; bottom:28px; width:128px; height:128px; border-radius:50%; background:url(assets/logo.png) center/104% no-repeat #fbf5e9; box-shadow:0 6px 22px rgba(0,0,0,.45), 0 0 0 3px var(--gold); z-index:36; }
.card { position:absolute; background:rgba(14,16,22,.94); border:2px solid rgba(217,169,58,.85); border-radius:18px; padding:22px 26px; box-sizing:border-box; }
.card h3 { margin:0 0 8px; font:700 36px/1.15 var(--disp); color:var(--gold); letter-spacing:.5px; }
.card p { margin:6px 0; font:500 24px/1.4 var(--body); }
.card.big p { font-size:28px; } .card.big .k { font-size:22px; }
.card p b { color:var(--gold); font-weight:700; }
.k { font:700 18px var(--mono); letter-spacing:3px; color:var(--gold); text-transform:uppercase; }
.huge { position:absolute; left:70px; font:700 128px/1.0 var(--disp); letter-spacing:0; text-shadow:0 6px 30px rgba(0,0,30,.5); }
.pill { display:inline-block; font:700 26px var(--mono); background:var(--cream); color:var(--ink); border-radius:40px; padding:10px 22px; }
#eq { position:absolute; left:70px; top:120px; font:700 88px var(--disp); letter-spacing:0; text-shadow:0 4px 24px rgba(0,0,30,.6); }
#eq span { display:inline-block; padding:0 10px; border-radius:14px; }
#eq span.on { background:var(--gold); color:var(--ink); }
#eqcap { position:absolute; left:80px; top:250px; font:700 30px var(--mono); }
.bar { position:absolute; bottom:0; width:120px; background:var(--gold); border-radius:10px 10px 0 0; }
svg { position:absolute; inset:0; overflow:visible; }
.node { position:absolute; transform:translate(-50%,-50%); text-align:center; font:700 40px var(--disp); background:var(--cream); color:var(--ink); border-radius:16px; padding:14px 24px; border:4px solid var(--gold); white-space:nowrap; }
.node small { display:block; font:600 20px var(--body); color:#39425a; margin-top:4px; }
.node.navy { background:var(--navy); color:var(--cream); } .node.navy small { color:#cdd6ee; }
.btn { position:absolute; height:96px; border-radius:50px; font:700 40px/96px var(--disp); text-align:center; color:#fff; box-shadow:0 10px 30px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="root">
  <canvas id="gl"></canvas>
  <div id="veil"></div>
  <svg id="lines" viewBox="0 0 1920 1080"></svg>
  <div id="labels"></div>
  <div id="ovs"></div>
  <div id="prog"></div><div id="dots"></div>
  <div id="chip"><b></b><span></span></div><div id="src"></div>
  <div id="logo"></div>
  <div id="flash"></div>
</div>
<script type="module" src="film.js"></script>
</body>
</html>
