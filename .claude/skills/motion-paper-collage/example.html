<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Collage</title>
<style>
@font-face { font-family:"Archivo Black"; src:url("../motion-core/fonts/archivo-black.woff2") format("woff2"); font-weight:400 900; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight:400; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-700.woff2") format("woff2"); font-weight:500 900; }
@font-face { font-family:"Playfair Display"; src:url("../motion-core/fonts/playfair-display-italic.woff2") format("woff2"); font-style:italic; }
:root { --ink:#0e0e0e; --paper:#efe9df; --accent:#ff4a1c; --blue:#2433ff; --pink:#f4a7c4; --yellow:#ffc21a; --lime:#c6ff3d;
  --display: "Archivo Black","Arial Black","Helvetica Neue",Arial,sans-serif; --mono: "JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif: "Playfair Display",Georgia,"Times New Roman",serif; }
html, body { margin:0; background:#111; overflow:hidden; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#e9e2d3; transform-origin:0 0;
  font-family: var(--display); color: var(--ink); }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#root { background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1.4px); background-size: 7px 7px; }
.pc { position:absolute; will-change:transform; }
.ht { background: radial-gradient(circle, #1a1a1a 38%, transparent 42%) 0 0/16px 16px, var(--pink); }
.ht2 { background: radial-gradient(circle, #1a1a1a 30%, transparent 34%) 0 0/12px 12px, var(--yellow); }
.tape { position:absolute; width:150px; height:46px; background:rgba(240,228,190,.82); }
#head { position:absolute; left:640px; top:430px; padding:26px 46px; background:var(--accent); color:var(--paper);
  font-size:110px; letter-spacing:-3px; line-height:1; }
#sub { position:absolute; left:690px; top:600px; padding:10px 20px; background:var(--ink); color:var(--paper); font:700 30px var(--mono); }
</style>
</head>
<body>
<div id="root" data-composition-id="motion-paper-collage" data-width="1920" data-height="1080" data-duration="6">
<div class="pc ht" id="p1" style="left:180px;top:140px;width:520px;height:380px"></div>
<div class="pc" id="p2" style="left:1180px;top:110px;width:560px;height:420px;background:var(--blue)"></div>
<div class="pc ht2" id="p3" style="left:300px;top:600px;width:460px;height:340px"></div>
<div class="pc" id="p4" style="left:1240px;top:580px;width:480px;height:360px;background:#2b2b2b"></div>
<div class="pc" id="p5" style="left:860px;top:220px;width:300px;height:300px;background:var(--paper);border:3px solid var(--ink)"></div>
<div class="tape" id="t1" style="left:230px;top:118px"></div>
<div class="tape" id="t2" style="left:1560px;top:90px"></div>
<div class="pc" id="head">CUT &amp; PASTE</div>
<div class="pc" id="sub">THE HISTORY OF COLLAGE</div>
</div>
<script>
// ---- motion kit (inlined so the file stands alone) ----
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const seg = (t, a, b) => clamp((t - a) / (b - a));          // 0..1 progress of t through [a,b]
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  in: x => x * x * x,
  out: x => 1 - (1 - x) ** 3,
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  expo: x => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  back: x => { const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; },
  elastic: x => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - 0.75) * 2.0944) + 1),
  bounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; },
};
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function ctx2d(id) { const c = document.getElementById(id); c.width = W; c.height = H; return c.getContext("2d"); }
function rot(p, ax, ay, az = 0) { let [x, y, z] = p, c, s;
  c = Math.cos(ax); s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(ay); s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(az); s = Math.sin(az); [x, y] = [x * c - y * s, x * s + y * c];
  return [x, y, z]; }
function proj(p, f = 1400, cx = W / 2, cy = H / 2) { const k = f / (f + p[2]); return [cx + p[0] * k, cy + p[1] * k, k]; }
function mix(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = sh => Math.round(lerp((a >> sh) & 255, (b >> sh) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
const C = { ink: "#0e0e0e", paper: "#efe9df", accent: "#ff4a1c", blue: "#2433ff",
  pink: "#f4a7c4", yellow: "#ffc21a", lime: "#c6ff3d", white: "#ffffff" };
// ---- end kit ----
const DUR = 6;
function torn(seed, n = 34, amp = 2.2) { const r = rng(seed), pts = [];
  const edge = (x0, y0, x1, y1) => { for (let i = 0; i < n; i++) { const u = i / n;
    pts.push(`${(lerp(x0, x1, u) + (r() - 0.5) * amp * (y0 === y1 ? 0 : 1)).toFixed(2)}% ${(lerp(y0, y1, u) + (r() - 0.5) * amp * (x0 === x1 ? 0 : 1)).toFixed(2)}%`); } };
  edge(1, 1, 99, 1); edge(99, 1, 99, 99); edge(99, 99, 1, 99); edge(1, 99, 1, 1); return `polygon(${pts.join(",")})`; }
const pieces = ["#p1", "#p2", "#p3", "#p4", "#p5"].map($);
pieces.forEach((p, i) => p.style.clipPath = torn(11 + i));
const rots = [-4, 3, 5, -3, 8];
function renderAt(t) {
  const tq = Math.floor(t * 12) / 12, fi = Math.floor(t * 12);
  $("#root").style.opacity = E.out(seg(tq, 0, 0.4));
  pieces.forEach((p, i) => { const a = 0.3 + i * 0.4, k = seg(tq, a, a + 0.4), kb = E.back(k);
    const boil = (rng(fi * 31 + i)() - 0.5) * 1.2;
    const lift = (1 - E.out(k)) * 26;
    p.style.opacity = k > 0 ? 1 : 0;
    p.style.transform = `translateY(${(1 - kb) * -60}px) rotate(${rots[i] * (2 - kb) + boil}deg) scale(${lerp(1.25, 1, kb)})`;
    p.style.filter = `drop-shadow(${6 + lift}px ${10 + lift}px ${4 + lift}px rgba(0,0,0,.28))`; });
  [["#t1", 2.9, -8], ["#t2", 3.05, 12]].forEach(([id, a, r]) => { const k = seg(tq, a, a + 0.25);
    $(id).style.opacity = k > 0 ? 1 : 0; $(id).style.transform = `rotate(${r}deg) scale(${lerp(1.4, 1, E.out(k))})`; });
  [["#head", 2.8], ["#sub", 3.2]].forEach(([id, a]) => { const k = seg(tq, a, a + 0.35), boil = (rng(fi * 7 + a * 10)() - 0.5) * 1.2;
    $(id).style.opacity = k > 0 ? 1 : 0; $(id).style.transform = `rotate(${-2 + boil}deg) scale(${lerp(1.8, 1, E.back(k))})`; });
}
// ---- boot: HyperFrames timeline + browser preview ----
(function () {
  const root = document.getElementById("root");
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); root.style.transform = k < 1 ? `scale(${k})` : ""; };
  fit(); addEventListener("resize", fit);
  // In HyperFrames (GSAP loaded): one paused timeline whose tween calls renderAt with the scene's local time.
  if (window.gsap) { const id = root.dataset.compositionId, tl = gsap.timeline({ paused: true });
    tl.to({ p: 0 }, { p: 1, duration: DUR, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
    window.__timelines = window.__timelines || {}; window.__timelines[id] = tl; }
  const q = new URLSearchParams(location.search);
  const start = () => {
    if (q.has("play")) { const s0 = performance.now();
      const loop = () => { renderAt(((performance.now() - s0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
    else renderAt(parseFloat(q.get("t")) || 0);
  };
  renderAt(parseFloat(q.get("t")) || 0);
  document.fonts.ready.then(start);  // re-render once the bundled fonts are in
})();
</script>
</body>
</html>
