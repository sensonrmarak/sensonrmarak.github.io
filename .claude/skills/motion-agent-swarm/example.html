<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Swarm</title>
<style>
@font-face { font-family:"Archivo Black"; src:url("../motion-core/fonts/archivo-black.woff2") format("woff2"); font-weight:400 900; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight:400; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-700.woff2") format("woff2"); font-weight:500 900; }
@font-face { font-family:"Playfair Display"; src:url("../motion-core/fonts/playfair-display-italic.woff2") format("woff2"); font-style:italic; }
:root { --ink:#0e0e0e; --paper:#efe9df; --accent:#ff4a1c; --blue:#2433ff; --pink:#f4a7c4; --yellow:#ffc21a; --lime:#c6ff3d;
  --display: "Archivo Black","Arial Black","Helvetica Neue",Arial,sans-serif; --mono: "JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif: "Playfair Display",Georgia,"Times New Roman",serif; }
html, body { margin:0; background:#111; overflow:hidden; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--ink); transform-origin:0 0;
  font-family: var(--display); color: var(--ink); }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

</style>
</head>
<body>
<div id="root" data-composition-id="motion-agent-swarm" data-width="1920" data-height="1080" data-duration="7">
<canvas id="cv"></canvas>
</div>
<script>
// ---- motion kit (inlined so the file stands alone) ----
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const seg = (t, a, b) => clamp((t - a) / (b - a));          // 0..1 progress of t through [a,b]
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  in: x => x * x * x,
  out: x => 1 - (1 - x) ** 3,
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  expo: x => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  back: x => { const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; },
  elastic: x => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - 0.75) * 2.0944) + 1),
  bounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; },
};
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function ctx2d(id) { const c = document.getElementById(id); c.width = W; c.height = H; return c.getContext("2d"); }
function rot(p, ax, ay, az = 0) { let [x, y, z] = p, c, s;
  c = Math.cos(ax); s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(ay); s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(az); s = Math.sin(az); [x, y] = [x * c - y * s, x * s + y * c];
  return [x, y, z]; }
function proj(p, f = 1400, cx = W / 2, cy = H / 2) { const k = f / (f + p[2]); return [cx + p[0] * k, cy + p[1] * k, k]; }
function mix(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = sh => Math.round(lerp((a >> sh) & 255, (b >> sh) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
const C = { ink: "#0e0e0e", paper: "#efe9df", accent: "#ff4a1c", blue: "#2433ff",
  pink: "#f4a7c4", yellow: "#ffc21a", lime: "#c6ff3d", white: "#ffffff" };
// ---- end kit ----
const DUR = 7;
const g = ctx2d("cv"), NA = 8, RR = 360, cx = W / 2, cy = H / 2, rr = rng(9);
const names = ["SEARCH", "CODE", "TEST", "REVIEW", "DESIGN", "WRITE", "DEPLOY", "MONITOR"];
const ag = names.map((n, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / NA; return { n, a, x: cx + Math.cos(a) * RR * 1.25, y: cy + Math.sin(a) * RR, sp: 0.6 + i * 0.1, fin: 3.0 + rr() * 1.8 }; });
const font = (w, s, f) => g.font = `${w} ${s}px ${f === "m" ? "'JetBrains Mono', monospace" : "'Archivo Black', Arial Black, sans-serif"}`;
function renderAt(t) {
  g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
  const core = E.back(seg(t, 0, 0.6));
  ag.forEach(a => { const k = E.back(seg(t, a.sp, a.sp + 0.8)); if (k <= 0) return;
    const mx = (cx + a.x) / 2 - Math.sin(a.a) * 90, my = (cy + a.y) / 2 + Math.cos(a.a) * 90, u = clamp(k, 0, 1.2);
    a.px = (1 - u) ** 2 * cx + 2 * (1 - u) * u * mx + u * u * a.x; a.py = (1 - u) ** 2 * cy + 2 * (1 - u) * u * my + u * u * a.y;
    g.strokeStyle = "rgba(239,233,223,.18)"; g.lineWidth = 2; g.beginPath(); g.moveTo(cx, cy); g.quadraticCurveTo(mx, my, a.px, a.py); g.stroke(); a.mx = mx; a.my = my; });
  const packet = (a, p, col) => { for (let j = 0; j < 7; j++) { const q = clamp(p - j * 0.025); if (q <= 0 || q >= 1) continue; const u = E.inOut(q);
    const x = (1 - u) ** 2 * cx + 2 * (1 - u) * u * a.mx + u * u * a.x, y = (1 - u) ** 2 * cy + 2 * (1 - u) * u * a.my + u * u * a.y;
    g.fillStyle = col; g.globalAlpha = 1 - j / 7; g.beginPath(); g.arc(x, y, 9 - j, 0, 7); g.fill(); } g.globalAlpha = 1; };
  ag.forEach((a, i) => { if (t > a.sp + 0.8) { packet(a, seg(t, 1.8 + i * 0.08, 2.6 + i * 0.08), C.accent); }
    if (t > a.fin) { const back = seg(t, a.fin + 0.1, a.fin + 0.8); if (back > 0 && back < 1) { const u = 1 - back; packet(a, u, C.lime); } } });
  g.fillStyle = `rgba(255,74,28,${0.18 * core})`; g.beginPath(); g.arc(cx, cy, 120 * core + 10 * Math.sin(t * 3) * (t > 5.6 ? 1 : 0), 0, 7); g.fill();
  g.fillStyle = C.accent; g.beginPath(); g.arc(cx, cy, 70 * core, 0, 7); g.fill();
  g.fillStyle = C.ink; font(400, 30); g.textAlign = "center"; g.textBaseline = "middle"; g.globalAlpha = core; g.fillText(t > 5.6 ? "DONE" : "CORE", cx, cy); g.globalAlpha = 1;
  ag.forEach(a => { const k = E.back(seg(t, a.sp, a.sp + 0.8)); if (k <= 0) return; const done = t > a.fin, dk = E.back(seg(t, a.fin, a.fin + 0.3));
    g.fillStyle = done ? C.lime : "#262626"; g.strokeStyle = done ? C.lime : "#555"; g.lineWidth = 3;
    g.beginPath(); g.arc(a.px, a.py, 44 * Math.min(k, 1.1) * (done ? 1 + 0.15 * Math.sin(dk * Math.PI) : 1), 0, 7); g.fill(); g.stroke();
    if (!done && t > 2.4) { g.strokeStyle = C.accent; g.lineWidth = 5; g.beginPath(); g.arc(a.px, a.py, 56, t * 6, t * 6 + 1.8); g.stroke(); }
    if (done) { g.strokeStyle = C.ink; g.lineWidth = 7; g.lineCap = "round"; g.beginPath(); g.moveTo(a.px - 16, a.py + 2); g.lineTo(a.px - 4, a.py + 14); g.lineTo(a.px + 18, a.py - 12); g.stroke(); }
    g.fillStyle = "rgba(239,233,223,.8)"; font(700, 20, "m"); g.textAlign = "center"; g.fillText(a.n, a.px, a.py + 74); });
}
// ---- boot: HyperFrames timeline + browser preview ----
(function () {
  const root = document.getElementById("root");
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); root.style.transform = k < 1 ? `scale(${k})` : ""; };
  fit(); addEventListener("resize", fit);
  // In HyperFrames (GSAP loaded): one paused timeline whose tween calls renderAt with the scene's local time.
  if (window.gsap) { const id = root.dataset.compositionId, tl = gsap.timeline({ paused: true });
    tl.to({ p: 0 }, { p: 1, duration: DUR, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
    window.__timelines = window.__timelines || {}; window.__timelines[id] = tl; }
  const q = new URLSearchParams(location.search);
  const start = () => {
    if (q.has("play")) { const s0 = performance.now();
      const loop = () => { renderAt(((performance.now() - s0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
    else renderAt(parseFloat(q.get("t")) || 0);
  };
  renderAt(parseFloat(q.get("t")) || 0);
  document.fonts.ready.then(start);  // re-render once the bundled fonts are in
})();
</script>
</body>
</html>
