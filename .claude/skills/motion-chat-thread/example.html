<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Thread</title>
<style>
@font-face { font-family:"Archivo Black"; src:url("../motion-core/fonts/archivo-black.woff2") format("woff2"); font-weight:400 900; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight:400; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-700.woff2") format("woff2"); font-weight:500 900; }
@font-face { font-family:"Playfair Display"; src:url("../motion-core/fonts/playfair-display-italic.woff2") format("woff2"); font-style:italic; }
:root { --ink:#0e0e0e; --paper:#efe9df; --accent:#ff4a1c; --blue:#2433ff; --pink:#f4a7c4; --yellow:#ffc21a; --lime:#c6ff3d;
  --display: "Archivo Black","Arial Black","Helvetica Neue",Arial,sans-serif; --mono: "JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif: "Playfair Display",Georgia,"Times New Roman",serif; }
html, body { margin:0; background:#111; overflow:hidden; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#e9ecf2; transform-origin:0 0;
  font-family: var(--display); color: var(--ink); }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.wrap { position:absolute; left:50%; top:90px; width:860px; height:900px; margin-left:-430px; overflow:hidden; border-radius:40px; background:#f7f8fb; box-shadow:0 40px 90px rgba(20,30,60,.18); }
.hdr { position:absolute; left:0; right:0; top:0; height:110px; background:#fff; display:flex; align-items:center; gap:22px; padding:0 34px; z-index:3; font:700 30px var(--mono); }
.hdr i { width:60px; height:60px; border-radius:50%; background:var(--accent); }
#col { position:absolute; left:0; right:0; top:130px; }
.m { position:absolute; max-width:600px; padding:24px 30px; border-radius:34px; font:500 30px/1.35 var(--mono); }
.them { left:34px; background:#fff; color:#111; border-bottom-left-radius:8px; transform-origin:0 100%; box-shadow:0 4px 12px rgba(0,0,0,.05); }
.me { right:34px; background:var(--blue); color:#fff; border-bottom-right-radius:8px; transform-origin:100% 100%; }
.typing { left:34px; width:120px; height:74px; padding:0; background:#fff; border-bottom-left-radius:8px; transform-origin:0 100%; }
.typing span { position:absolute; top:30px; width:14px; height:14px; border-radius:50%; background:#9aa0ab; }
</style>
</head>
<body>
<div id="root" data-composition-id="motion-chat-thread" data-width="1920" data-height="1080" data-duration="7">
<div class="wrap"><div class="hdr"><i></i>Studio Assistant</div><div id="col"></div></div>
</div>
<script>
// ---- motion kit (inlined so the file stands alone) ----
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const seg = (t, a, b) => clamp((t - a) / (b - a));          // 0..1 progress of t through [a,b]
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  in: x => x * x * x,
  out: x => 1 - (1 - x) ** 3,
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  expo: x => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  back: x => { const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; },
  elastic: x => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - 0.75) * 2.0944) + 1),
  bounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; },
};
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function ctx2d(id) { const c = document.getElementById(id); c.width = W; c.height = H; return c.getContext("2d"); }
function rot(p, ax, ay, az = 0) { let [x, y, z] = p, c, s;
  c = Math.cos(ax); s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(ay); s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(az); s = Math.sin(az); [x, y] = [x * c - y * s, x * s + y * c];
  return [x, y, z]; }
function proj(p, f = 1400, cx = W / 2, cy = H / 2) { const k = f / (f + p[2]); return [cx + p[0] * k, cy + p[1] * k, k]; }
function mix(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = sh => Math.round(lerp((a >> sh) & 255, (b >> sh) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
const C = { ink: "#0e0e0e", paper: "#efe9df", accent: "#ff4a1c", blue: "#2433ff",
  pink: "#f4a7c4", yellow: "#ffc21a", lime: "#c6ff3d", white: "#ffffff" };
// ---- end kit ----
const DUR = 7;
const SCRIPT = [["them", "Hey! Want to make a launch video today?", 0.9, 0.6], ["me", "Yes. 15 seconds, bold type.", 1.6, 0],
  ["them", "Done. I wrote it as code, so every frame renders exactly the same.", 3.4, 1.0], ["me", "Can you make the logo land harder?", 4.2, 0],
  ["them", "Added a squash and a shockwave ring.", 5.8, 0.8]];
const col = $("#col"), msgs = [];
SCRIPT.forEach(([who, text, at, typ]) => { const d = document.createElement("div"); d.className = "m " + who; d.textContent = text; col.appendChild(d);
  let ty = null; if (typ) { ty = document.createElement("div"); ty.className = "m typing"; ty.innerHTML = "<span style='left:26px'></span><span style='left:53px'></span><span style='left:80px'></span>"; col.appendChild(ty); }
  msgs.push({ d, ty, at, typ, who }); });
let lay = null;
function layout() { let y = 0; lay = msgs.map(m => { const h = m.d.offsetHeight; const r = { y, h }; y += h + 22; return r; }); }
function renderAt(t) {
  if (!lay || document.fonts.status !== "loaded") layout();
  let bottom = 0;
  msgs.forEach((m, i) => { const L = lay[i], k = E.back(seg(t, m.at, m.at + 0.35)), vis = t >= m.at;
    m.d.style.top = `${L.y}px`; m.d.style.opacity = vis ? 1 : 0; m.d.style.transform = `scale(${vis ? k : 0})`;
    if (vis) bottom = L.y + L.h;
    if (m.ty) { const on = t >= m.at - m.typ && t < m.at; m.ty.style.top = `${L.y}px`; m.ty.style.opacity = on ? 1 : 0;
      m.ty.style.transform = `scale(${on ? E.back(seg(t, m.at - m.typ, m.at - m.typ + 0.25)) : 0})`;
      [...m.ty.children].forEach((s, j) => s.style.transform = `translateY(${-8 * Math.max(0, Math.sin(t * 9 - j * 0.9))}px)`);
      if (on) bottom = Math.max(bottom, L.y + 74); } });
  const target = Math.max(0, bottom - 700);
  col.style.transform = `translateY(${-target}px)`;
}
// ---- boot: HyperFrames timeline + browser preview ----
(function () {
  const root = document.getElementById("root");
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); root.style.transform = k < 1 ? `scale(${k})` : ""; };
  fit(); addEventListener("resize", fit);
  // In HyperFrames (GSAP loaded): one paused timeline whose tween calls renderAt with the scene's local time.
  if (window.gsap) { const id = root.dataset.compositionId, tl = gsap.timeline({ paused: true });
    tl.to({ p: 0 }, { p: 1, duration: DUR, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
    window.__timelines = window.__timelines || {}; window.__timelines[id] = tl; }
  const q = new URLSearchParams(location.search);
  const start = () => {
    if (q.has("play")) { const s0 = performance.now();
      const loop = () => { renderAt(((performance.now() - s0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
    else renderAt(parseFloat(q.get("t")) || 0);
  };
  renderAt(parseFloat(q.get("t")) || 0);
  document.fonts.ready.then(start);  // re-render once the bundled fonts are in
})();
</script>
</body>
</html>
