<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer Explode</title>
<style>
@font-face { font-family:"Archivo Black"; src:url("../motion-core/fonts/archivo-black.woff2") format("woff2"); font-weight:400 900; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight:400; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-700.woff2") format("woff2"); font-weight:500 900; }
@font-face { font-family:"Playfair Display"; src:url("../motion-core/fonts/playfair-display-italic.woff2") format("woff2"); font-style:italic; }
:root { --ink:#0e0e0e; --paper:#efe9df; --accent:#ff4a1c; --blue:#2433ff; --pink:#f4a7c4; --yellow:#ffc21a; --lime:#c6ff3d;
  --display: "Archivo Black","Arial Black","Helvetica Neue",Arial,sans-serif; --mono: "JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif: "Playfair Display",Georgia,"Times New Roman",serif; }
html, body { margin:0; background:#111; overflow:hidden; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#e7e9ee; transform-origin:0 0;
  font-family: var(--display); color: var(--ink); }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.wrap { position:absolute; left:760px; top:680px; transform-style:preserve-3d; }
.iso { transform-style:preserve-3d; transform:rotateX(55deg) rotateZ(-40deg); }
.ly { position:absolute; left:-360px; top:-240px; width:720px; height:480px; border-radius:26px; box-shadow:0 30px 40px rgba(20,30,60,.12); }
.l0 { background:#fff; } .l1 { background:repeating-linear-gradient(90deg, rgba(36,51,255,.18) 0 50px, transparent 50px 66px), rgba(255,255,255,.55); }
.l2 { background:transparent; box-shadow:none; } .l2 i { position:absolute; border-radius:18px; }
.l3 { background:transparent; box-shadow:none; } .l3 i { position:absolute; border-radius:40px; background:var(--accent); }
.lab { position:absolute; left:1240px; font:700 26px var(--mono); color:#333; white-space:nowrap; }
.lab b { display:block; font:400 40px var(--display); color:#111; letter-spacing:-1px; }
svg { position:absolute; inset:0; }
</style>
</head>
<body>
<div id="root" data-composition-id="motion-layer-explode" data-width="1920" data-height="1080" data-duration="6">
<svg viewBox="0 0 1920 1080" id="lines"></svg>
<div class="wrap"><div class="iso" id="iso">
  <div class="ly l0" id="L0"></div>
  <div class="ly l1" id="L1"></div>
  <div class="ly l2" id="L2"><i style="left:40px;top:40px;width:640px;height:90px;background:#0e0e0e"></i><i style="left:40px;top:160px;width:300px;height:280px;background:var(--blue)"></i><i style="left:380px;top:160px;width:300px;height:280px;background:var(--yellow)"></i></div>
  <div class="ly l3" id="L3"><i style="left:470px;top:380px;width:210px;height:70px"></i></div>
</div></div>
<div class="lab" id="T0"><b>Surface</b>01 / background</div><div class="lab" id="T1"><b>Grid</b>02 / 12 columns</div><div class="lab" id="T2"><b>Content</b>03 / cards</div><div class="lab" id="T3"><b>Actions</b>04 / floating UI</div>
</div>
<script>
// ---- motion kit (inlined so the file stands alone) ----
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const seg = (t, a, b) => clamp((t - a) / (b - a));          // 0..1 progress of t through [a,b]
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  in: x => x * x * x,
  out: x => 1 - (1 - x) ** 3,
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  expo: x => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  back: x => { const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; },
  elastic: x => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - 0.75) * 2.0944) + 1),
  bounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; },
};
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function ctx2d(id) { const c = document.getElementById(id); c.width = W; c.height = H; return c.getContext("2d"); }
function rot(p, ax, ay, az = 0) { let [x, y, z] = p, c, s;
  c = Math.cos(ax); s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(ay); s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(az); s = Math.sin(az); [x, y] = [x * c - y * s, x * s + y * c];
  return [x, y, z]; }
function proj(p, f = 1400, cx = W / 2, cy = H / 2) { const k = f / (f + p[2]); return [cx + p[0] * k, cy + p[1] * k, k]; }
function mix(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = sh => Math.round(lerp((a >> sh) & 255, (b >> sh) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
const C = { ink: "#0e0e0e", paper: "#efe9df", accent: "#ff4a1c", blue: "#2433ff",
  pink: "#f4a7c4", yellow: "#ffc21a", lime: "#c6ff3d", white: "#ffffff" };
// ---- end kit ----
const DUR = 6;
const GAP = 120, Ls = [0, 1, 2, 3].map(i => $("#L" + i)), Ts = [0, 1, 2, 3].map(i => $("#T" + i)), NS = "http://www.w3.org/2000/svg";
const lines = Ts.map(() => { const l = document.createElementNS(NS, "line"); l.setAttribute("stroke", "#333"); l.setAttribute("stroke-width", 2); $("#lines").appendChild(l); return l; });
// project a point on a layer (x, y in layer px from its centre, z height) with the same rotateX(55) rotateZ(-40) as CSS
function iso(x, y, z) { const a = -40 * Math.PI / 180, b = 55 * Math.PI / 180; const x1 = x * Math.cos(a) - y * Math.sin(a), y1 = x * Math.sin(a) + y * Math.cos(a);
  const y2 = y1 * Math.cos(b) - z * Math.sin(b); return [760 + x1, 680 + y2]; }
function renderAt(t) {
  $("#iso").parentNode.style.opacity = E.out(seg(t, 0, 0.6));
  const col = E.inOut(seg(t, 4.2, 5.2));
  Ls.forEach((l, i) => { const k = E.back(seg(t, 0.8 + i * 0.12, 1.6 + i * 0.12)) * (1 - col); l.style.transform = `translateZ(${i * GAP * k}px)`;
    const [ax, ay] = iso(360, 0, i * GAP * k), lk = E.out(seg(t, 1.8 + i * 0.15, 2.3 + i * 0.15)) * (1 - E.out(seg(t, 4.0, 4.4)));
    const ty = ay - 40 + i * 14; Ts[i].style.top = `${ty - 20}px`; Ts[i].style.opacity = lk; Ts[i].style.transform = `translateX(${(1 - lk) * 30}px)`;
    const ln = lines[i]; ln.setAttribute("x1", ax); ln.setAttribute("y1", ay); ln.setAttribute("x2", lerp(ax, 1225, lk)); ln.setAttribute("y2", lerp(ay, ty + 20, lk)); ln.setAttribute("opacity", lk); });
}
// ---- boot: HyperFrames timeline + browser preview ----
(function () {
  const root = document.getElementById("root");
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); root.style.transform = k < 1 ? `scale(${k})` : ""; };
  fit(); addEventListener("resize", fit);
  // In HyperFrames (GSAP loaded): one paused timeline whose tween calls renderAt with the scene's local time.
  if (window.gsap) { const id = root.dataset.compositionId, tl = gsap.timeline({ paused: true });
    tl.to({ p: 0 }, { p: 1, duration: DUR, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
    window.__timelines = window.__timelines || {}; window.__timelines[id] = tl; }
  const q = new URLSearchParams(location.search);
  const start = () => {
    if (q.has("play")) { const s0 = performance.now();
      const loop = () => { renderAt(((performance.now() - s0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
    else renderAt(parseFloat(q.get("t")) || 0);
  };
  renderAt(parseFloat(q.get("t")) || 0);
  document.fonts.ready.then(start);  // re-render once the bundled fonts are in
})();
</script>
</body>
</html>
