<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marker Draw</title>
<style>
@font-face { font-family:"Archivo Black"; src:url("../motion-core/fonts/archivo-black.woff2") format("woff2"); font-weight:400 900; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight:400; }
@font-face { font-family:"JetBrains Mono"; src:url("../motion-core/fonts/jetbrains-mono-700.woff2") format("woff2"); font-weight:500 900; }
@font-face { font-family:"Playfair Display"; src:url("../motion-core/fonts/playfair-display-italic.woff2") format("woff2"); font-style:italic; }
:root { --ink:#0e0e0e; --paper:#efe9df; --accent:#ff4a1c; --blue:#2433ff; --pink:#f4a7c4; --yellow:#ffc21a; --lime:#c6ff3d;
  --display: "Archivo Black","Arial Black","Helvetica Neue",Arial,sans-serif; --mono: "JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif: "Playfair Display",Georgia,"Times New Roman",serif; }
html, body { margin:0; background:#111; overflow:hidden; }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--paper); transform-origin:0 0;
  font-family: var(--display); color: var(--ink); }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#txt { position:absolute; left:150px; top:170px; font-size:170px; line-height:1.08; letter-spacing:-5px; z-index:2; }
.ln { overflow:hidden; } .ln span { display:inline-block; }
svg { position:absolute; inset:0; z-index:3; }
#hl { mix-blend-mode:multiply; }
</style>
</head>
<body>
<div id="root" data-composition-id="motion-marker-draw" data-width="1920" data-height="1080" data-duration="6">
<svg viewBox="0 0 1920 1080" style="z-index:1"><rect id="hl" x="0" y="0" width="0" height="0" fill="#ffc21a" opacity=".85"/></svg>
<div id="txt"><div class="ln"><span id="a1">Good design is</span></div><div class="ln"><span id="a2">never <b id="w2" style="font-weight:inherit">twice</b></span></div><div class="ln"><span id="a3">the same.</span></div></div>
<svg viewBox="0 0 1920 1080"><path id="loop" fill="none" stroke="#ff4a1c" stroke-width="12" stroke-linecap="round"/><path id="und" fill="none" stroke="#2433ff" stroke-width="11" stroke-linecap="round"/></svg>
</div>
<script>
// ---- motion kit (inlined so the file stands alone) ----
const W = 1920, H = 1080;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const seg = (t, a, b) => clamp((t - a) / (b - a));          // 0..1 progress of t through [a,b]
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  in: x => x * x * x,
  out: x => 1 - (1 - x) ** 3,
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  expo: x => (x >= 1 ? 1 : 1 - 2 ** (-10 * x)),
  back: x => { const c = 1.70158; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; },
  elastic: x => (x <= 0 ? 0 : x >= 1 ? 1 : 2 ** (-10 * x) * Math.sin((x * 10 - 0.75) * 2.0944) + 1),
  bounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; },
};
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) | 0;
  let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
function ctx2d(id) { const c = document.getElementById(id); c.width = W; c.height = H; return c.getContext("2d"); }
function rot(p, ax, ay, az = 0) { let [x, y, z] = p, c, s;
  c = Math.cos(ax); s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(ay); s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(az); s = Math.sin(az); [x, y] = [x * c - y * s, x * s + y * c];
  return [x, y, z]; }
function proj(p, f = 1400, cx = W / 2, cy = H / 2) { const k = f / (f + p[2]); return [cx + p[0] * k, cy + p[1] * k, k]; }
function mix(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = sh => Math.round(lerp((a >> sh) & 255, (b >> sh) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
const C = { ink: "#0e0e0e", paper: "#efe9df", accent: "#ff4a1c", blue: "#2433ff",
  pink: "#f4a7c4", yellow: "#ffc21a", lime: "#c6ff3d", white: "#ffffff" };
// ---- end kit ----
const DUR = 6;
function wordBox(el, frac0 = 0, frac1 = 1) { const r = el.getBoundingClientRect(), R = $("#root").getBoundingClientRect(), k = R.width / W;
  return { x: (r.left - R.left) / k, y: (r.top - R.top) / k, w: r.width / k, h: r.height / k }; }
let geo = null;
function layout() {
  const ids = ["#a1", "#a2", "#a3"], keep = ids.map(i => $(i).style.transform);
  ids.forEach(i => $(i).style.transform = "none");   // measure the resting layout, not a mid-tween one
  const a2 = $("#a2"), b = wordBox($("#a3")), w2 = wordBox($("#w2"));
  const range = document.createRange(); range.setStart(a2.firstChild, 0); range.setEnd(a2.firstChild, 5);
  const rr = range.getBoundingClientRect(), R = $("#root").getBoundingClientRect(), k = R.width / W;
  const nv = { x: (rr.left - R.left) / k, y: (rr.top - R.top) / k, w: rr.width / k, h: rr.height / k };
  const cx = w2.x + w2.w / 2, cy = w2.y + w2.h / 2 + 8, rx = w2.w / 2 + 40, ry = w2.h / 2 + 10;
  $("#loop").setAttribute("d", `M${cx - rx * 0.2} ${cy - ry * 1.05} C${cx + rx * 0.9} ${cy - ry * 1.15} ${cx + rx * 1.1} ${cy + ry * 0.9} ${cx} ${cy + ry} C${cx - rx * 1.15} ${cy + ry * 1.05} ${cx - rx * 1.05} ${cy - ry * 0.9} ${cx + rx * 0.25} ${cy - ry * 1.12}`);
  const uy = b.y + b.h - 6; let d = `M${b.x} ${uy}`;
  for (let x = b.x; x < b.x + b.w; x += 60) d += ` q30 ${x % 120 ? 14 : -14} 60 0`;
  $("#und").setAttribute("d", d);
  geo = { nv, L1: $("#loop").getTotalLength(), L2: $("#und").getTotalLength() };
  ids.forEach((i, n) => $(i).style.transform = keep[n]);
  $("#loop").style.strokeDasharray = geo.L1; $("#und").style.strokeDasharray = geo.L2;
}
function renderAt(t) {
  if (!geo || !renderAt.ready) { layout(); renderAt.ready = document.fonts.status === "loaded"; }
  [["#a1", 0], ["#a2", 0.12], ["#a3", 0.24]].forEach(([id, d]) => { const k = E.expo(seg(t, d, d + 0.8)); $(id).style.transform = `translateY(${(1 - k) * 110}%)`; });
  const hk = E.inOut(seg(t, 1.0, 1.6)), nv = geo.nv;
  const hl = $("#hl"); hl.setAttribute("x", nv.x - 14); hl.setAttribute("y", nv.y + nv.h * 0.3); hl.setAttribute("height", nv.h * 0.6);
  hl.setAttribute("width", (nv.w + 28) * hk); hl.setAttribute("transform", `rotate(-1.5 ${nv.x} ${nv.y})`);
  $("#loop").style.strokeDashoffset = geo.L1 * (1 - E.inOut(seg(t, 1.8, 2.6)));
  $("#und").style.strokeDashoffset = geo.L2 * (1 - E.inOut(seg(t, 2.8, 3.4)));
}
// ---- boot: HyperFrames timeline + browser preview ----
(function () {
  const root = document.getElementById("root");
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); root.style.transform = k < 1 ? `scale(${k})` : ""; };
  fit(); addEventListener("resize", fit);
  // In HyperFrames (GSAP loaded): one paused timeline whose tween calls renderAt with the scene's local time.
  if (window.gsap) { const id = root.dataset.compositionId, tl = gsap.timeline({ paused: true });
    tl.to({ p: 0 }, { p: 1, duration: DUR, ease: "none", onUpdate: () => renderAt(tl.time()) }, 0);
    window.__timelines = window.__timelines || {}; window.__timelines[id] = tl; }
  const q = new URLSearchParams(location.search);
  const start = () => {
    if (q.has("play")) { const s0 = performance.now();
      const loop = () => { renderAt(((performance.now() - s0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
    else renderAt(parseFloat(q.get("t")) || 0);
  };
  renderAt(parseFloat(q.get("t")) || 0);
  document.fonts.ready.then(start);  // re-render once the bundled fonts are in
})();
</script>
</body>
</html>
